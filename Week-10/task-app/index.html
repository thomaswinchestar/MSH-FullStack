<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Task Manager</h1>
            <p class="subtitle">Stay organized and get things done!</p>
        </header>

        <div class="task-input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?" class="task-input">
            <button id="addBtn" class="add-btn">
                <span class="btn-icon">+</span>
                <span class="btn-text">Add Task</span>
            </button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Active</span>
                <span class="stat-value" id="activeTasks">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Completed</span>
                <span class="stat-value" id="completedTasks">0</span>
            </div>
        </div>

        <div class="task-list-container">
            <ul id="taskList" class="task-list"></ul>
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📋</div>
                <p>No tasks yet!</p>
                <p class="empty-subtitle">Add a task to get started</p>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
