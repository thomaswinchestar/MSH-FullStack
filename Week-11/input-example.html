<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Input Sample</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form {
            max-width: 300px;
            margin: auto;
        }
        .form div {
            margin-bottom: 10px;
        }
        #result {
            margin-top: 10px;
            font-weight: bold;
        }
        label {
            display: none;
            color: red;
        }

    </style>
</head>
<body>
    <h1>Add Form</h1>
    <div class="form">
        <div>
            <input type="text" id="a">
            <label for="a">Please Enter Correct Number</label>
        </div>
        <div>
            <input type="text" id="b">
            <label for="b">Please Enter Correct Number</label>
        </div>
        <div id="result"></div>
        <button id="add">Add</button>
    </div>

    <script>

        document.querySelector("#a").onkeyup = function() {
            let a = parseInt(document.querySelector("#a").value)
            if( !isNaN(a) ) {
                document.querySelector("[for=a]").style.display = "none";
            }
        }

        document.querySelector("#b").onkeyup = function() {
            let a = parseInt(document.querySelector("#b").value)
            if( !isNaN(a) ) {
                document.querySelector("[for=b]").style.display = "none";
            }
        }

        document.querySelector("#add").onclick = function() {
            //Number.isInteger()
            //isNaN()
            let a = parseInt(document.querySelector("#a").value)
            let b = parseInt(document.querySelector("#b").value)

            if( isNaN(a) ) {
                document.querySelector("[for=a]").style.display = "block";
            }

            if( isNaN(b) ) {
                document.querySelector("[for=b]").style.display = "block";
            }

            let result = a + b;

            if( !isNaN(result)) {
                document.querySelector("#result").textContent = "Result: " + result;
            }


        }
    </script>
</body>
</html>
